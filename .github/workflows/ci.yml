# CI（v2.2 §11.1）：每次 push 必跑轻量门禁（ruff/black、pytest 单测（Mock LLM 零网络）、
# vitest、tsc/eslint、build）。依赖 LLM/浏览器的测试（接口/E2E/安全/协作/评测）本地跑，不进 CI。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Generate shared tokens
        run: python scripts/generate_tokens.py
      - name: Lint
        run: ruff check backend/ scripts/
      - name: Unit & interface tests (Mock LLM, zero network)
        run: |
          cd backend
          python -m pytest tests/ -q

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate shared tokens
        run: python scripts/generate_tokens.py
      - name: Type-check & build
        working-directory: frontend
        run: npm run build
      - name: Unit & component tests
        working-directory: frontend
        run: npx vitest run
