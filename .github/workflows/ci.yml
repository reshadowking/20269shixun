# CI（v2.2 §11.1）：每次 push 必跑轻量门禁（ruff/black、pytest 单测（Mock LLM 零网络）、
# vitest、tsc/eslint、build）。依赖 LLM/浏览器的测试（接口/E2E/安全/协作/评测）本地跑，不进 CI。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    services:
      # T52 收尾批：给 test_db_init_postgres.py（P0 事故回归）提供真 Postgres——
      # 该测试验证 _ensure_* 补列在 Postgres 上的事务语义（aborted transaction），
      # SQLite 复现不了；CI 不跑 = 回归防护降级为文档。镜像/凭据与 docker/docker-compose.yml 对齐。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Generate shared tokens
        run: python scripts/generate_tokens.py
      - name: Lint
        run: ruff check backend/ scripts/
      - name: Unit & interface tests (Mock LLM, zero network)
        run: |
          cd backend
          python -m pytest tests/ -q
        env:
          # 仅供 test_db_init_postgres.py（P0 回归）连接上方 service 的维护库；其余测试仍走 SQLite
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate shared tokens
        run: python scripts/generate_tokens.py
      - name: Type-check & build
        working-directory: frontend
        run: npm run build
      - name: Unit & component tests
        working-directory: frontend
        run: npx vitest run
