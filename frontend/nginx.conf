# 前端 nginx 配置：静态资源 + /api 反向代理到后端容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API 代理（后端容器名 backend，compose 内网互联）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # AI 生成最长约 60s，留足余量
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
